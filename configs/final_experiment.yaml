# ==============================================================================
# RM-VMusic: Final Master Experiment Configuration
# Project: Reliable Multimodal Vietnamese Music Genre Classification under Distribution Shift
# ==============================================================================

project:
  name: "RM-VMusic"
  version: "3.0-Production"
  date: "2026-08-28"
  primary_metric: "Macro-F1"
  seeds:
    - 42
    - 123
    - 2024
    - 3407
    - 7777

taxonomy:
  num_classes: 12
  classes:
    - "POP_BALLAD"
    - "BOLERO_TRUTINH"
    - "INSTRUMENTAL"
    - "RAP_HIPHOP"
    - "FOLK_TRADITIONAL"
    - "DANCE_EDM"
    - "REVOLUTIONARY"
    - "NHAC_TRINH"
    - "ROCK"
    - "RB_SOUL"
    - "OTHER"
    - "CHILDREN"

dataset:
  master_catalog: "data/processed/final_12class_metadata_v3.csv"
  splits_dir: "data/splits"
  scenarios:
    iid:
      train: "data/splits/iid/train.csv"
      val: "data/splits/iid/val.csv"
      test: "data/splits/iid/test.csv"
    artist_disjoint:
      train: "data/splits/artist_disjoint/train.csv"
      val: "data/splits/artist_disjoint/val.csv"
      test: "data/splits/artist_disjoint/test.csv"
    temporal:
      train: "data/splits/temporal/train.csv"
      val: "data/splits/temporal/val.csv"
      test: "data/splits/temporal/test.csv"
    label_shift:
      train: "data/splits/label_shift/train.csv"
      val: "data/splits/label_shift/val.csv"
      test: "data/splits/label_shift/test.csv"
    missing_modality:
      test: "data/splits/missing_modality/test.csv"

modalities:
  lyrics:
    enabled: true
    feature_type: "TF-IDF (unigrams + bigrams)"
    dimension: 5000
    physical_cache: "data/features/lyrics/lyrics_features_5000.npy"
    source_dir: "data/lyrics"
  cover:
    enabled: true
    feature_type: "Spatial Color Histogram + RGB Gradient Moments"
    dimension: 512
    physical_cache: "data/features/cover/cover_features_512.npy"
    source_dir: "data/covers"
  audio:
    enabled: true
    feature_type: "Acoustic Spectral / Zero-Masked for Missing"
    dimension: 128
    physical_cache: "data/features/audio/audio_features_128.npy"
    source_dir: "data/audio"

model:
  proj_dim: 256
  hidden_dim: 128
  dropout: 0.30
  modality_dropout_p: 0.20
  temperature: 0.10
  use_reliability: true
  use_modality_dropout: true

training:
  batch_size: 64
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weighting: "balanced_on_train_split"
  early_stopping_patience: 8
  loss:
    ce_weight: 1.00
    supcon_weight: 0.15
    invariance_weight: 0.05

evaluation:
  metrics:
    - "Macro-F1"
    - "Accuracy"
    - "Weighted-F1"
    - "ECE (Expected Calibration Error)"
    - "Brier Score"
