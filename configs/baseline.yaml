# ==============================================================================
# RM-VMusic: Physical Modality Baselines Configuration
# ==============================================================================

experiment:
  name: "rm_vmusic_physical_baselines"
  seeds:
    - 42
    - 123
    - 2024
    - 3407
    - 7777
  num_classes: 12
  device: "cpu"

genres:
  - "POP_BALLAD"
  - "BOLERO_TRUTINH"
  - "INSTRUMENTAL"
  - "RAP_HIPHOP"
  - "FOLK_TRADITIONAL"
  - "DANCE_EDM"
  - "REVOLUTIONARY"
  - "NHAC_TRINH"
  - "ROCK"
  - "RB_SOUL"
  - "OTHER"
  - "CHILDREN"

dataset:
  master_catalog: "data/processed/final_12class_metadata_v3.csv"
  splits_dir: "data/splits"
  scenarios:
    iid:
      train: "data/splits/iid/train.csv"
      val: "data/splits/iid/val.csv"
      test: "data/splits/iid/test.csv"
    artist_disjoint:
      train: "data/splits/artist_disjoint/train.csv"
      val: "data/splits/artist_disjoint/val.csv"
      test: "data/splits/artist_disjoint/test.csv"
    temporal:
      train: "data/splits/temporal/train.csv"
      val: "data/splits/temporal/val.csv"
      test: "data/splits/temporal/test.csv"
    label_shift:
      train: "data/splits/label_shift/train.csv"
      val: "data/splits/label_shift/val.csv"
      test: "data/splits/label_shift/test.csv"
    missing_modality:
      test: "data/splits/missing_modality/test.csv"

models:
  - "Lyrics_Only_TFIDF"
  - "Cover_Only_Visual"
  - "Audio_Only_ZeroMasked"
  - "Early_Concat_Baseline"
  - "Late_Fusion_Ensemble"

training:
  batch_size: 64
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weighting: "balanced_on_train_split"
  early_stopping_patience: 8
