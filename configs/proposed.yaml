# ==============================================================================
# RM-VMusic: Proposed Method Configuration
# Model: Uncertainty-Aware Dynamic Multimodal Fusion under Distribution Shift (UAD-Fusion)
# ==============================================================================

experiment:
  name: "rm_vmusic_uad_fusion_v4"
  seeds:
    - 42
    - 123
    - 2024
    - 3407
    - 7777
  num_classes: 12
  device: "cpu"

genres:
  - "POP_BALLAD"
  - "FOLK_TRADITIONAL"
  - "BOLERO_TRUTINH"
  - "INSTRUMENTAL"
  - "REVOLUTIONARY"
  - "RAP_HIPHOP"
  - "ROCK"
  - "RB_SOUL"
  - "DANCE_EDM"
  - "CHILDREN"
  - "NHAC_TRINH"
  - "OTHER"

dataset:
  master_catalog: "data/processed/final_12class_metadata_v4.csv"
  splits_dir: "data/splits"
  scenarios:
    iid:
      train: "data/splits/iid/train.csv"
      val: "data/splits/iid/val.csv"
      test: "data/splits/iid/test.csv"
    artist_disjoint:
      train: "data/splits/artist_disjoint/train.csv"
      val: "data/splits/artist_disjoint/val.csv"
      test: "data/splits/artist_disjoint/test.csv"
    temporal:
      train: "data/splits/temporal/train.csv"
      val: "data/splits/temporal/val.csv"
      test: "data/splits/temporal/test.csv"
    label_shift:
      train: "data/splits/label_shift/train.csv"
      val: "data/splits/label_shift/val.csv"
      test: "data/splits/label_shift/test.csv"
    missing_modality:
      test: "data/splits/missing_modality/test.csv"

model:
  audio_dim: 128
  lyrics_dim: 5000
  cover_dim: 512
  proj_dim: 256
  hidden_dim: 128
  dropout: 0.30
  temperature: 0.10

modality_dropout:
  enabled: true
  p_audio: 0.20
  p_lyrics: 0.20
  p_cover: 0.20

loss:
  type: "weighted_ce"
  focal_gamma: 2.0
  lambda_uncertainty: 0.10
  lambda_robustness: 0.05
  lambda_contrastive: 0.15

training:
  batch_size: 64
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weighting: "balanced_on_train_split"
  early_stopping_patience: 8
